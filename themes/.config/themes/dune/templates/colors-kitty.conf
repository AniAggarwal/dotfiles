# Dune theme — generated by matugen from {{image}}
# source color: {{colors.source_color.default.hex}}

# Core
background              {{colors.surface.default.hex}}
foreground              {{colors.on_surface.default.hex}}

cursor                  {{colors.primary.default.hex}}
cursor_text_color       {{colors.on_primary.default.hex}}

selection_background    {{colors.secondary_container.default.hex}}
selection_foreground    {{colors.on_secondary_container.default.hex}}

url_color               {{colors.tertiary.default.hex}}

# Window borders
active_border_color     {{colors.primary.default.hex}}
inactive_border_color   {{colors.outline.default.hex}}
bell_border_color       {{colors.error.default.hex}}

# Tab bar
tab_bar_background      {{colors.surface_container_low.default.hex}}
active_tab_background   {{colors.primary.default.hex}}
active_tab_foreground   {{colors.on_primary.default.hex}}
inactive_tab_background {{colors.surface_container.default.hex}}
inactive_tab_foreground {{colors.on_surface_variant.default.hex}}

# ANSI 16 — normal (0-7) are darkened variants, bright (8-15) are the full roles
# black
color0  {{colors.surface_container.default.hex}}
color8  {{colors.outline.default.hex}}
# red -> error
color1  {{ colors.error.default.hex | to_color | lighten: -15.0 | format: "hex" }}
color9  {{colors.error.default.hex}}
# green -> secondary
color2  {{ colors.secondary.default.hex | to_color | lighten: -12.0 | format: "hex" }}
color10 {{colors.secondary.default.hex}}
# yellow -> primary (spice)
color3  {{ colors.primary.default.hex | to_color | lighten: -12.0 | format: "hex" }}
color11 {{colors.primary.default.hex}}
# blue -> tertiary
color4  {{ colors.tertiary.default.hex | to_color | lighten: -12.0 | format: "hex" }}
color12 {{colors.tertiary.default.hex}}
# magenta -> source color (wallpaper accent)
color5  {{ colors.source_color.default.hex | to_color | lighten: -10.0 | format: "hex" }}
color13 {{ colors.source_color.default.hex | to_color | lighten: 10.0 | format: "hex" }}
# cyan -> tertiary_fixed (lighter tertiary pair)
color6  {{colors.tertiary_fixed_dim.default.hex}}
color14 {{colors.tertiary_fixed.default.hex}}
# white
color7  {{colors.on_surface_variant.default.hex}}
color15 {{ colors.on_surface.default.hex | to_color | lighten: 8.0 | format: "hex" }}
