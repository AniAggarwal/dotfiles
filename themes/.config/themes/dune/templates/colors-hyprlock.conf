# Dune theme — hyprlock color variables (generated by matugen, do not edit)
# Text / ring / inner colors ONLY — the background stays `screenshot`,
# never template a background path here.
# Consumed via: source = ~/.config/themes/current/colors-hyprlock.conf

$foreground = rgb({{colors.on_surface.default.hex_stripped}})
$fontColor = rgb({{colors.on_surface.default.hex_stripped}})
$innerColor = rgba({{colors.surface_container.default.hex_stripped}}80)
$outerColor = rgba({{colors.primary.default.hex_stripped}}aa)
$checkColor = rgba({{colors.tertiary.default.hex_stripped}}aa)
$failColor = rgba({{colors.error.default.hex_stripped}}cc)
$capsLockColor = rgba({{colors.secondary.default.hex_stripped}}aa)

# For pango markup inside label/placeholder text (hyprlock needs the doubled #)
$accentPango = ##{{colors.primary.default.hex_stripped}}
