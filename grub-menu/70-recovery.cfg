# Recovery entries ("Advanced options for Arch Linux" → "… (recovery mode)").
# They boot with GRUB_CMDLINE_LINUX only, so none of the GRUB_CMDLINE_LINUX_DEFAULT options
# apply (resume, pcie_aspm, any experiment from another drop-in): a bad option can't stop them
# booting, and with no resume they never restore a stale hibernation image. They start the
# rescue shell (root password); `systemctl default` from there continues to a normal login.
# Installed to /etc/default/grub.d/70-recovery.cfg.
GRUB_DISABLE_RECOVERY=false
