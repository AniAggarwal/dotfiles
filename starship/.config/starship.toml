# Snappier prompt with lower timeout
command_timeout = 250

# Dune palette — role names map to the terminal's 16 ANSI colors, so the
# prompt follows whatever palette kitty is themed with (zero hex colors).
palette = "dune"

[palettes.dune]
spice = "yellow"          # primary accent
sand = "bright-white"     # bright foreground
rust = "red"              # danger / dirty state
fremen = "blue"           # branches / context
worm = "bright-yellow"    # emphasis
water = "green"           # environments
shadow = "bright-black"   # muted / secondary

[aws]
symbol = "  "
format = '\[[$symbol($profile)(\($region\))(\[$duration\])]($style)\]'

[buf]
symbol = " "
format = '\[[$symbol($version)]($style)\]'

[c]
symbol = " "
format = '\[[$symbol($version(-$name))]($style)\]'

[cmake]
format = '\[[$symbol($version)]($style)\]'

[cmd_duration]
style = "bold worm"
format = '\[[󱎫$duration]($style)\]'

[cobol]
