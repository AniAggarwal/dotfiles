source = /home/ani/.config/themes/current/colors-hyprlock.conf

general {
    grace = 1 # in seconds
    hide_cursor = true
}

background { 
    monitor =
    # path = ~/.config/hypr/dune-worm-wallpaper.jpg
    path = screenshot
    blur_passes = 3
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# INPUT FIELD
input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = $outerColor
    inner_color = $innerColor
    font_color = $fontColor
    check_color = $checkColor
    fail_color = $failColor
    capslock_color = $capsLockColor
    fade_on_empty = false
    font_family = FiraCode Nerd Font
    placeholder_text = <i><span foreground="$accentPango">Input Password...</span></i>
    hide_input = false
    position = 0, -100
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%-I:%M%p")"
    color = $foreground
    #color = rgba(255, 255, 255, 0.6)
    font_size = 120
    font_family = FiraCode Nerd Font Light
    position = 0, 20
    halign = center
    valign = center
}

# DUNE QUOTE
label {
    monitor =
    text = cmd[update:60000] jq -r '.[] | "<i>\(.quote)</i>  —  \(.author)"' ~/.config/hypr/quotes.json | shuf -n1
    color = $fontColor
    font_size = 16
    font_family = FiraCode Nerd Font Light
    position = 0, 60
    halign = center
    valign = bottom
}

