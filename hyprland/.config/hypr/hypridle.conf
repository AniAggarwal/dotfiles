general {
    # --immediate-render draws the background without waiting on resources. Without it,
    # hyprlock can block on a Wayland output-configure roundtrip after a hibernate resume
    # and stall for minutes *after* a successful auth (frozen lock screen, then a delayed
    # "spontaneous" unlock).
    lock_cmd = pidof hyprlock || ~/bin/lock-hidden --immediate-render   # one hyprlock; windows hidden during the fade-in.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    # No `hyprctl reload` here: a full config reload the instant the system wakes, while outputs
    # are still coming back, aborts Hyprland in CMonitorResources::initFB (crashed on 2026-11-18
    # and 2026-11-23, identical stacks). Wait for the outputs to settle, then only redo the lid
    # check. Cycle DPMS off->on rather than just on: forces the compositor to re-send an output
    # configure event immediately, which is the event hyprlock is waiting on after resume.
    after_sleep_cmd = sleep 2; hyprctl eval 'on_resume()'; hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'; sleep 0.5; hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 270                                # in seconds; dims 30 s before the lock
    on-timeout = brightnessctl -s set 10         # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r                 # monitor backlight restore.
}

# turn off keyboard backlight, comment out this section if you dont have a keyboard backlight.
listener { 
    timeout = 270                                          # in seconds
    on-timeout = brightnessctl -sd rgb:kbd_backlight set 0 # turn off keyboard backlight.
    on-resume = brightnessctl -rd rgb:kbd_backlight        # turn on keyboard backlight.
}

listener {
    timeout = 300                                 # in seconds
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

listener {
    timeout = 330                                 # in seconds
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'  # screen off when timeout has passed
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'    # screen on when activity is detected after timeout has fired.
}

listener {
    timeout = 600                                 # in seconds
    on-timeout = systemctl suspend                # suspend pc
}
