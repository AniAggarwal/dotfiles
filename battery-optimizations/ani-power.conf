# CPU power settings, applied by /usr/local/bin/power-apply at boot, after resume, and whenever
# AC is plugged in or out. Nothing runs in between.
#
# install.sh copies this file to /etc/ani-power.conf, root-owned, the first time only. After that
# the copy in /etc is the live one: the ani-bar CPU panel saves to it through power-apply, which
# rewrites the whole file. To edit it by hand, run `sudoedit /etc/ani-power.conf`, then
# `sudo power-apply event`.
#
# Keys (all optional; a missing key leaves that setting as it is):
#   governor                       performance | powersave
#   energy_performance_preference  one of /sys/devices/system/cpu/cpu0/cpufreq/energy_performance_available_preferences
#   platform_profile               one of /sys/firmware/acpi/platform_profile_choices
#   turbo                          on | off
#   scaling_min_freq               kHz; when missing, the CPU's lowest frequency
#   scaling_max_freq               kHz; when missing, the CPU's highest frequency

[charger]
governor = performance
energy_performance_preference = performance
platform_profile = performance
turbo = on

[battery]
governor = powersave
energy_performance_preference = power
platform_profile = quiet
turbo = off
scaling_min_freq = 400000
