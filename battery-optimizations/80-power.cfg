# Kernel parameters for battery life (installed to /etc/default/grub.d/80-power.cfg; then
# `sudo grub-mkconfig -o /boot/grub/grub.cfg`).
#   pcie_aspm=force: enable PCIe link power saving on the NVMe drives (firmware declares no OS
#     ASPM control); tested 2026-11-23, both drives at L1.2, no errors.
#   drm.edid_firmware: the OLED's EDID with a 48-line vblank so the 330 us PSR setup time fits
#     (see edid/README.md). Needs /usr/lib/firmware/edid/xps15-9520-oled-vblank48.bin in the
#     initramfs.
GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT} pcie_aspm=force drm.edid_firmware=eDP-1:edid/xps15-9520-oled-vblank48.bin"
