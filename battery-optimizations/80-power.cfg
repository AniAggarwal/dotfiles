# Kernel parameters for battery life (installed to /etc/default/grub.d/80-power.cfg; then
# `sudo grub-mkconfig -o /boot/grub/grub.cfg`).
#   pcie_aspm=force: enable PCIe link power saving on the NVMe drives (firmware declares no OS
#     ASPM control); tested 2026-11-23, both drives at L1.2, no errors.
#   i915.psr_setup_time=220: lets the OLED use Panel Self Refresh. Only the patched
#     linux-lts-psr kernel (~/dev/custom-aur-packages/linux-lts-psr) knows it; stock kernels
#     log "unknown parameter" and ignore it. Tested 2026-11-24: PSR1 enabled, package reaches
#     PC6/PC8 (was stuck at PC3).
# The OLED EDID override (edid/) is NOT here: the panel stays black with it (2026-11-23).
GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT} pcie_aspm=force i915.psr_setup_time=220"
